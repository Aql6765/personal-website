<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Alpie.me</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <meta charset="UTF-8" />
</head>

<body>
    <div class="loading-screen">
        <div class="loading-content">
            <svg width="65" height="65" fill="lightseagreen" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,20a9,9,0,1,1,9-9A9,9,0,0,1,12,21Z" />
                <rect x="11" y="6" rx="1" width="2" height="7">
                    <animateTransform attributeName="transform" type="rotate" dur="9s" values="0 12 12;360 12 12"
                        repeatCount="indefinite" />
                </rect>
                <rect x="11" y="11" rx="1" width="2" height="9">
                    <animateTransform attributeName="transform" type="rotate" dur="0.75s" values="0 12 12;360 12 12"
                        repeatCount="indefinite" />
                </rect>
            </svg>
            <p class="loading-text">Loading...</p>
            <br>
            <button class="loading-skip">Skip loading</button>
        </div>
    </div>
    <br>
    <div class="site-content">
    </div>
    <div class="desktop">
        <div class="aboutMeIcon">
            <button class="aboutMeButton" style="background-color: transparent;border: none;">
                <img src="assets/YOUBI.png" style="width: 100px;border-radius: 10%;" />
                <p>About Me</p>
            </button>
        </div>
        <div class="taskbar">
            <div class="stopButtonContainer">
                <button class="stopButton">
                    <img src="assets/favicon.ico" class="stopButtonImage" />
                    <p class="stopButtonText">Stop</p>
                </button>
            </div>
            <p>new v3 test <a href="index.html?old" class="link-style1">old version</a></p>
        </div>
    </div>
</body>

</html>
